<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>Aquatic Adventures - Fish Products</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            background-color: #fff5ec;
        }


        /* Navigation Bar */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #FFA500;
            padding: 1rem 2rem;
            z-index: 1000;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color:#008080;
        }

        .nav-links {
            list-style: none;
            display: flex;
        }

        .nav-links li {
            margin-left: 1.5rem;
        }

        .nav-links a {
            text-decoration: none;
            color: #008080;
            font-weight: bold;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: #3713ba;
        }

        /* Page Header */
        .page-header {
            padding: 6rem 2rem 2rem;
            text-align: center;
            background: url('Products.jpg') no-repeat center center/cover;
            color: #005252;
        }

        .page-header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .page-header p {
            font-size: 1.2rem;
        }

        /* Intro Section */
        .intro {
            padding: 2rem;
            text-align: center;
            background-color: white;
        }

        .intro h2 {
            color: #008080;
            margin-bottom: 1rem;
        }

        .intro p {
            max-width: 800px;
            margin: auto;
            font-size: 1.1rem;
            color: #008080;
        }

        .inventory-gallery {
            padding: 2rem;
            text-align: center;
            background-color: white;
        }

        .inventory-gallery h2 {
            font-size: 30px;
            color: #008080;
            margin-bottom: 1.5rem;
        }

        /* Container for images */
        .image-gallery {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        }

        /* Make all images the same size */
        .image-gallery img {
        width: 200px;       /* Fixed width */
        height: 200px;      /* Fixed height */
        object-fit: cover;  /* Crop to fill without distortion */
        border-radius: 8px; /* Optional: rounded corners */
        display: block;
    }

        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .inventory-grid img {
            width: 100%;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .supply-section {
            margin-top: 40px;   /* pushes the whole section down */
            padding-top: 2px;  /* optional: adds space inside the section */
            text-align: center;
        }

        .supply-section h3 {
            font-size: 30px;
            color: #008080;
            margin-top: 20px;
            padding-top: 20px; /* adds space above the title */
            margin-bottom: 1rem;
        }

        /* Product Grid */
        .products {
            padding: 2rem;
            text-align: center;
        }

        .products h2 {
            color: #FFA500;
            margin-bottom: 1.5rem;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .product {
            background: white;
            padding: 1rem;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .product img {
            max-width: 100%;
            border-radius: 5px;
        }

        .product h3 {
            margin: 0.5rem 0;
        }

        /* Footer */
        footer {
            left: 0;
            bottom: 0;
            width: auto;

            background-color: #222; /* dark background */
            color: white;
            text-align: center;
            padding: 15px 0;

            font-size: 12px;
        }

        /* Default: 2 images per row (portrait) */
        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        /* Landscape: 4 images per row */
        @media (orientation: landscape) {
        .navbar {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: flex-start;

            gap: 20px;               /* space between logo and links */
            padding: 0 10px;

            height: 55px;            /* lock navbar height */
            overflow-x: auto;        /* allow sideways scroll */
            overflow-y: hidden;      /* prevent dropping down */
            white-space: nowrap;     /* keep everything on one line */
        }

        .logo {
            flex-shrink: 0;          /* prevents logo from squishing or wrapping */
            font-size: 18px;
        }

        .nav-links {
            display: flex;
            flex-direction: row;
            gap: 15px;

            flex-shrink: 0;          /* prevents links from wrapping */
            white-space: nowrap;
        }

        .nav-links li {
            list-style: none;
        }

        .nav-links a {
            font-size: 14px;         /* slightly smaller for mobile */
            text-decoration: none;
        }

        .page-header {
            padding: 4rem 1rem 1rem;
            background-size: cover;
        }
    
        .inventory-grid {
            grid-template-columns: repeat(4, 1fr);
    }
}

   </style>
