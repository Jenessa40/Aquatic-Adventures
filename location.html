    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta-name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aquatic Adventures - Location</title>

    <style>
    /* RESET */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html, body {
        height: 100%;
    }

    body {
        min-height: 100dvh;          /* fixes mobile viewport gap */
        display: flex;
        flex-direction: column;
        font-family: Arial, sans-serif;
        background-color: seashell;
        padding-top: 55px;           /* so content isn't under navbar */
    }

    /* NAVBAR */
    .navbar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;

        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;  /* logo left, links right */

        padding: 0 15px;
        height: 55px;                    /* consistent height */
        background-color: #FFA500;

        white-space: nowrap;
        overflow-x: auto;                /* scrolls sideways on small screens */
        overflow-y: hidden;

        z-index: 1000;
    }

    .logo {
        flex-shrink: 0;
        font-size: 1.4rem;
        font-weight: bold;
        color: #008080;
    }

    .nav-links {
        list-style: none;
        display: flex;
        flex-direction: row;
        gap: 18px;
        flex-shrink: 0;
    }

    .nav-links li {
        list-style: none;
    }

    .nav-links a {
        text-decoration: none;
        color: #008080;
        font-weight: bold;
        font-size: 14px;
    }

    /* PAGE HEADER (not used here but kept if needed) */
    .page-header {
        padding: 6rem 2rem 2rem;
        text-align: left;
        background: url('locationphoto.jpg') no-repeat center center/cover;
        color: #FFA500;
    }

    /* MAIN CONTENT */
    .contact-container {
        flex: 1;                 /* makes content fill space and push footer down */
        display: flex;
        justify-content: center;
        padding: 2rem;
    }

    .contact-info {
        background: white;
        padding: 2rem;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        max-width: 500px;
        width: 100%;
        text-align: center;
    }

    .contact-info h2 {
        color: #FFA500;
        margin-bottom: 1rem;
    }

    .map {
        margin-top: 20px;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    /* FOOTER */
    footer {
        width: 100%;
        background-color: #222;  /* dark background */
        color: white;
        text-align: center;
        padding: 15px 0;
        font-size: 12px;
        margin-top: auto;        /* glue to bottom */
    }

    /* ===== PORTRAIT PHONES ===== */
    @media (max-width: 768px) and (orientation: portrait) {

        .navbar {
            justify-content: flex-start;
            gap: 20px;
            padding: 0 10px;
        }

        .logo {
            font-size: 18px;
        }

        .nav-links {
            gap: 15px;
        }

        .nav-links a {
            font-size: 14px;
        }

        .page-header {
            padding: 4rem 1rem 1rem;
            background-size: cover;
        }
    }
</style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="logo">Aquatic Adventures</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="fish.html">Fish</a></li>
            <li><a href="products.html">Fish Supplies</a></li>
            <li><a href="reptiles.html">Reptiles</a></li>
            <li><a href="location.html">Location</a></li>

            <li>
                <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
                <a href="https://www.facebook.com/people/Aquatic-Adventures/61558479800656/"
                   class="facebook-link"
                   target="_blank"
                   rel="noopener noreferrer">
                    <i class="fab fa-facebook"></i>
                </a>
            </li>
        </ul>
    </nav>

    <!-- MAIN CONTENT -->
    <section class="contact-container">
        <div class="contact-info">
            <h2>Location</h2>
            <p><strong>Address:</strong> 2624 23rd St, Columbus, NE 68601</p>
            <p><strong>Phone:</strong> (402) 835-9884</p>

            <div class="map">
                <iframe 
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2932.123456789!2d-97.3599696!3d41.4390927!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8790ebfa4c41d951%3A0xeeb05bf9b47925e2!2s2624%2023rd%20St%2C%20Columbus%2C%20NE%2068601!5e0!3m2!1sen!2sus!4v1710000000000!5m2!1sen!2sus" 
                    width="100%" 
                    height="250" 
                    style="border:0;" 
                    allowfullscreen 
                    loading="lazy">
                </iframe>
            </div>
        </div>
    </section>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2026 Aquatic Adventures. All rights reserved.</p>
    </footer>

</body>
</html>
