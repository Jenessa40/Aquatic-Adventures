        .contact-container {
            max-width: auto;

            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .contact-info {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .contact-info h2 {
            color: #FFA500;
            margin-bottom: 1rem;

            margin-bottom: 0.5rem;
        }

            margin-top: 1rem;
            background-color: #008080;
            color: white;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
        }

        .contact-form button:hover {
            background-color: #e67e22;
        }

        /* Map Section */
        .map {
            margin-top: 25px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }


        /* 1. Make layout fluid and mobile-friendly */
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }

        /* 2. Make images scale inside small screens */
        img {
            max-width: 100%;
            height: auto; /* keeps proportions */
        }
/* supported technique [InlineCitation-1-HTML Responsive Web Design](https://www.w3schools.com/html/html_responsive.asp) [InlineCitation-2-HTML & CSS Responsive Design](https://www.w3schools.com/htmlcss/htmlcss_responsive_design.asp) */


        /* 3. Base mobile-first layout: column stacking */
        .container {
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 16px;
        }

        /* 4. Responsive text that scales a bit */
        h1, h2, h3, p {
            font-size: clamp(1rem, 4vw, 1.3rem); /* fluid typography [InlineCitation-2-HTML & CSS Responsive Design](https://www.w3schools.com/htmlcss/htmlcss_responsive_design.asp) */
        }

        /* 5. Smartphone styles: screens 600px and below */
        @media screen and (max-width: 600px) { /* typical smartphone breakpoint [InlineCitation-3-Responsive Web Design Media Queries](https://www.w3schools.com/css/css_rwd_mediaqueries.asp) */
